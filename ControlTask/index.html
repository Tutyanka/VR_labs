<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ControlTask AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100%; height: 100%; font-family: sans-serif; background: #09131b; overflow: hidden; }

    #startScreen {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: radial-gradient(ellipse at 60% 30%, #1a2e40, #09131b);
    }
    #startScreen img { width: 160px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    #startScreen p { color: #dce8f0; font-size: 17px; text-align: center; line-height: 1.55; max-width: 300px; }
    #startBtn {
      padding: 16px 44px; border: none; border-radius: 999px;
      background: #d28d22; color: #fff; font-size: 20px; font-weight: 700; cursor: pointer;
    }

    #arOverlay {
      display: none; position: fixed; inset: 0 auto auto 0; margin: 12px;
      width: min(320px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 18px;
      background: rgba(0,0,0,0.5); color: #fff; font-size: 13px; line-height: 1.4; z-index: 20;
    }
    #arOverlay strong { display: block; font-size: 15px; margin-bottom: 4px; }

    canvas, video {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important; z-index: 0;
    }
    a-scene { z-index: 1; }
  </style>
</head>
<body>

  <div id="startScreen">
    <img src="./assets/controltask-marker.png" alt="Marker" />
    <p>Tap Start AR, then point your camera at the marker shown above (or the printed one).</p>
    <button id="startBtn">▶ Start AR</button>
  </div>

  <div id="arOverlay">
    <strong>ControlTask • AR.js</strong>
    Point camera at the marker · keep it fully visible · 20–50 cm away
  </div>

  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/aframe-ar.js"></script>

  <script>
    // Ding-dong component inlined — no external app.js dependency
    (function () {
      function rOfZ(z) {
        var v = (1 - z) * z * z;
        return v > 0 ? Math.sqrt(v) : 0;
      }

      function buildGeo() {
        var sU = 72, sV = 48;
        var pos = [], nor = [], uv = [], idx = [];
        for (var j = 0; j <= sV; j++) {
          var v = j / sV, z = -1 + 2 * v, r = rOfZ(z);
          var drdz = r > 1e-6 ? (z * (2 - 3 * z)) / (2 * r) : 0;
          for (var i = 0; i <= sU; i++) {
            var u = i / sU, th = u * Math.PI * 2;
            var c = Math.cos(th), s = Math.sin(th);
            pos.push(r * c, r * s, z);
            uv.push(u, v);
            var tu = new THREE.Vector3(-r * s, r * c, 0);
            var tv = new THREE.Vector3(drdz * c, drdz * s, 1);
            var n = new THREE.Vector3().crossVectors(tu, tv).normalize();
            nor.push(n.x, n.y, n.z);
          }
        }
        for (var j = 0; j < sV; j++) {
          for (var i = 0; i < sU; i++) {
            var a = j * (sU + 1) + i, b = a + 1, c2 = a + sU + 1, d = c2 + 1;
            idx.push(a, c2, b, b, c2, d);
          }
        }
        var g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(idx);
        return g;
      }

      AFRAME.registerComponent('dingdong-surface', {
        init: function () {
          var geo = buildGeo();
          var grp = new THREE.Group();

          var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            color: '#57b7d8', metalness: 0.24, roughness: 0.32, side: THREE.DoubleSide
          }));
          mesh.scale.setScalar(0.85);
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.y = 0.55;
          grp.add(mesh);

          var wire = new THREE.LineSegments(
            new THREE.EdgesGeometry(geo, 22),
            new THREE.LineBasicMaterial({ color: '#173546', transparent: true, opacity: 0.6 })
          );
          wire.scale.copy(mesh.scale);
          wire.rotation.copy(mesh.rotation);
          wire.position.copy(mesh.position);
          grp.add(wire);

          this._grp = grp; this._mesh = mesh; this._wire = wire;
          this.el.setObject3D('mesh', grp);
        },
        tick: function (t) {
          this._grp.rotation.y += 0.004;
          var s = 0.85 * (1 + Math.sin(t * 0.0024) * 0.025);
          this._mesh.scale.setScalar(s);
          this._wire.scale.setScalar(s);
        },
        remove: function () { this.el.removeObject3D('mesh'); }
      });
    })();
  </script>

  <script>
    document.getElementById('startBtn').addEventListener('click', function () {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('arOverlay').style.display = 'block';

      document.body.insertAdjacentHTML('beforeend',
        '<a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.5;">' +
          '<a-marker type="pattern" url="./assets/pattern-v2.patt" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="3">' +
            '<a-entity light="type: ambient; intensity: 0.9;"></a-entity>' +
            '<a-entity light="type: directional; intensity: 1.3;" position="1.5 2 1.4"></a-entity>' +
            '<a-entity dingdong-surface></a-entity>' +
          '</a-marker>' +
          '<a-entity camera></a-entity>' +
        '</a-scene>'
      );
    });
  </script>

</body>
</html>
